name: Landing Zone Pipeline

on:
  push:
    branches:
      - main

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  SUBSCRIPTION_ALIAS_NAME: ${{ vars.SUBSCRIPTION_ALIAS_NAME }}

jobs:
  terraform:
    # Prevents the job from running on the first run of the workflow (during vending and the secrets/vars are not yet available)
    if: github.run_number != 1 
    name: 'Deploy Terraform'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
  
      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="key=${{ env.SUBSCRIPTION_ALIAS_NAME }}" -backend-config="container_name=${{ env.SUBSCRIPTION_ALIAS_NAME }}" -backend-config="storage_account_name=satfstate${{ env.SUBSCRIPTION_ALIAS_NAME }}""

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"