name: Deploy Landing Zone

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string

env:
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}

jobs:
  terraform:
    # Prevents the job from running on the first run of the workflow (during vending and the secrets/vars are not yet available)
    if: github.run_number != 1 
    name: 'Deploy Terraform (${{ inputs.env }})'
    environment: ${{ inputs.env }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
  
      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="key=${{ vars.SUBSCRIPTION_ALIAS_NAME }}${{ inputs.env }}" -backend-config="container_name=${{ vars.SUBSCRIPTION_ALIAS_NAME }}${{ inputs.env }}" -backend-config="storage_account_name=satfstate${{ vars.SUBSCRIPTION_ALIAS_NAME }}${{ inputs.env }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -var "subscription_alias_name=${{ vars.SUBSCRIPTION_ALIAS_NAME }}" -var "environment=${{ inputs.env }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars" -var "subscription_alias_name=${{ vars.SUBSCRIPTION_ALIAS_NAME }}" -var "environment=${{ inputs.env }}"