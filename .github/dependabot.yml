version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/deploy/core/terraform"
      - "/deploy/dcstoremapping/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
